<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homes for sale | Matthew Real Estate</title>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .page-head { padding: 2.25rem 0 1.25rem; }
  .page-head h1 { font-size: clamp(1.9rem, 3.4vw, 2.6rem); }
  .page-head p { color: var(--muted); margin-top: .35rem; }
  .filters { display: grid; grid-template-columns: 1.4fr 1.2fr 1fr 1fr .8fr .8fr 1.1fr auto; gap: .75rem; align-items: end; background: var(--white); border: 1px solid var(--line); border-radius: var(--r-md); padding: 1rem; }
  .filters .btn { height: 46px; }
  .results-bar { display: flex; justify-content: space-between; align-items: center; margin: 1.5rem 0 1rem; color: var(--muted); min-height: 1.5rem; }
  .grid { grid-template-columns: repeat(3, 1fr); }
  .pager { display: flex; gap: .75rem; justify-content: center; align-items: center; margin: 2.5rem 0 4rem; color: var(--muted); }
  .pager .btn:disabled { opacity: .4; cursor: default; }
  .empty { background: var(--white); border: 1px dashed var(--line); border-radius: var(--r-md); padding: 2.5rem; text-align: center; display: grid; gap: .75rem; justify-items: center; }
  @media (max-width: 1000px) { .filters { grid-template-columns: 1fr 1fr; } .filters .btn { grid-column: 1 / -1; } .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="page-head">
    <h1 id="title">Homes for sale</h1>
    <p id="subtitle">Active listings from the MLS feed.</p>
  </div>

  <form class="filters" id="filters" role="search" aria-label="Filter listings">
    <div class="field"><label for="f-city">Location</label><input id="f-city" name="city" placeholder="City" maxlength="60"></div>
    <div class="field"><label for="f-type">Property type</label><select id="f-type" name="category"><option value="">Any type</option></select></div>
    <div class="field"><label for="f-min">Min price</label><input id="f-min" name="minPrice" inputmode="numeric" placeholder="No min"></div>
    <div class="field"><label for="f-max">Max price</label><input id="f-max" name="maxPrice" inputmode="numeric" placeholder="No max"></div>
    <div class="field"><label for="f-beds">Beds</label><select id="f-beds" name="beds"><option value="">Any</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option><option value="5">5+</option></select></div>
    <div class="field"><label for="f-baths">Baths</label><select id="f-baths" name="baths"><option value="">Any</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option></select></div>
    <div class="field"><label for="f-sort">Sort</label><select id="f-sort" name="sort"><option value="newest">Newest</option><option value="price_asc">Price, low to high</option><option value="price_desc">Price, high to low</option></select></div>
    <button class="btn btn-primary" type="submit">Search</button>
  </form>

  <div class="results-bar"><span id="status" role="status"></span></div>
  <div class="cards grid" id="grid"></div>
  <nav class="pager" id="pager" aria-label="Pages">
    <button class="btn btn-ghost" id="prev" type="button">Previous page</button>
    <span id="pageInfo"></span>
    <button class="btn btn-ghost" id="next" type="button">Next page</button>
  </nav>
</main>

<script type="module">
  import { api, mountChrome, listingCard, skeletonCards, saved, el, num } from "/assets/app.js";

  const PAGE_SIZE = 12;
  const url = new URL(location.href);
  const savedMode = url.searchParams.get("saved") === "1";
  mountChrome(savedMode ? "saved" : "buy");

  const form = document.getElementById("filters");
  const grid = document.getElementById("grid");
  const status = document.getElementById("status");
  const pager = document.getElementById("pager");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const pageInfo = document.getElementById("pageInfo");
  const typeSel = document.getElementById("f-type");
  let page = Math.max(1, parseInt(url.searchParams.get("page") || "1", 10) || 1);
  let total = 0;
  let labels = {};

  // Fill the form from the URL (homepage search lands here).
  const fill = () => { for (const k of ["city", "minPrice", "maxPrice", "beds", "baths", "sort"]) if (url.searchParams.has(k)) form.elements[k].value = url.searchParams.get(k); };
  fill();

  const typesReady = api.categories().then((d) => {
    for (const c of d.categories) { labels[c.id] = c.label; typeSel.append(el("option", { value: c.id, text: c.label })); }
    if (url.searchParams.has("category")) typeSel.value = url.searchParams.get("category");
  }).catch(() => {});

  function params() {
    const p = {};
    for (const [k, v] of new FormData(form)) {
      let val = String(v).trim();
      if (k === "minPrice" || k === "maxPrice") val = val.replace(/[$,\s]/g, "").replace(/k$/i, "000").replace(/m$/i, "000000");
      if (k === "city") val = val.replace(/\s+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
      if (val) p[k] = val;
    }
    return p;
  }

  function syncUrl(p) {
    const q = new URLSearchParams(p);
    if (page > 1) q.set("page", page);
    history.replaceState(null, "", "/listings/" + (q.toString() ? "?" + q : ""));
  }

  function setHeading(p) {
    const t = document.getElementById("title");
    const label = p.category && labels[p.category];
    t.textContent = label ? `${label} for sale` : "Homes for sale";
    document.title = `${t.textContent}${p.city ? " in " + p.city : ""} | Matthew Real Estate`;
  }

  function emptyState(msg, action) {
    grid.replaceChildren(el("div", { class: "empty", style: "grid-column:1/-1" }, el("p", { text: msg }), action));
  }

  async function load() {
    const p = params();
    syncUrl(p);
    setHeading(p);
    status.textContent = "Loading listings";
    skeletonCards(grid, 6, 330);
    try {
      const d = await api.listings({ ...p, page, pageSize: PAGE_SIZE });
      total = d.total || 0;
      if (!d.results.length) {
        emptyState("No homes match these filters. Try widening the price range or clearing the location.",
          el("button", { class: "btn btn-ghost", type: "button", text: "Clear filters", onclick: () => { form.reset(); typeSel.value = ""; page = 1; load(); } }));
      } else {
        grid.replaceChildren(...d.results.map((r) => listingCard(r)));
      }
      status.textContent = total ? `${num(total)} homes` : "";
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      pageInfo.textContent = `Page ${num(page)} of ${num(pages)}`;
      prev.disabled = page <= 1;
      next.disabled = page >= pages;
      pager.hidden = !d.results.length;
    } catch (e) {
      status.textContent = "";
      grid.replaceChildren(el("p", { class: "error", style: "grid-column:1/-1", text: e.message }));
      pager.hidden = true;
    }
  }

  async function loadSaved() {
    form.hidden = true;
    pager.hidden = true;
    document.getElementById("title").textContent = "Saved homes";
    document.getElementById("subtitle").textContent = "Stored on this device. Tap the heart on a home to remove it.";
    document.title = "Saved homes | Matthew Real Estate";
    const list = saved.all();
    if (!list.length) {
      emptyState("You haven't saved any homes yet. Tap the heart on a listing to keep it here.", el("a", { class: "btn btn-primary", href: "/listings/", text: "Browse homes" }));
      return;
    }
    skeletonCards(grid, Math.min(list.length, 6), 330);
    const results = await Promise.allSettled(list.map((s) => api.listing(s.key, s.dataset, s.p)));
    const ok = results.map((r, i) => r.status === "fulfilled" ? listingCard(r.value, { dataset: list[i].dataset }) : null).filter(Boolean);
    const gone = results.length - ok.length;
    status.textContent = `${ok.length} saved` + (gone ? `, ${gone} no longer available` : "");
    ok.length ? grid.replaceChildren(...ok) : emptyState("Your saved homes are no longer listed.", el("a", { class: "btn btn-primary", href: "/listings/", text: "Browse homes" }));
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); page = 1; load(); });
  form.elements.sort.addEventListener("change", () => { page = 1; load(); });
  prev.addEventListener("click", () => { if (page > 1) { page--; load(); scrollTo({ top: 0 }); } });
  next.addEventListener("click", () => { page++; load(); scrollTo({ top: 0 }); });

  if (savedMode) loadSaved();
  else typesReady.then(load);
</script>
</body>
</html>
