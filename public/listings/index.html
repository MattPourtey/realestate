<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listings | Matt Pourteymaur Real Estate</title>
<style>
  :root {
    --bg: #0a1015; --panel: #111a22; --line: #1f2c38; --text: #e6edf3;
    --muted: #8b98a5; --accent: #22c55e; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  a { color: inherit; }
  header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  header .brand { color: var(--accent); font-weight: 700; font-size: 1.25rem; text-decoration: none; }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  .demo { background: #2a1f05; color: var(--warn); border: 1px solid #4a3608; padding: .5rem 1.5rem; font-size: .85rem; }
  main { max-width: 1200px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .75rem; background: var(--panel); border: 1px solid var(--line); padding: 1rem; border-radius: 10px; }
  label { display: grid; gap: .3rem; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: .5rem .6rem; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #04130a; border-color: var(--accent); font-weight: 600; align-self: end; }
  .status { color: var(--muted); margin: 1rem 0; min-height: 1.2em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; transition: border-color .15s; }
  .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--line); }
  .card .body { padding: .8rem .9rem 1rem; display: grid; gap: .25rem; }
  .price { font-size: 1.25rem; font-weight: 700; }
  .facts { color: var(--muted); font-size: .9rem; }
  .addr { font-size: .9rem; }
  .pager { display: flex; gap: .5rem; justify-content: center; align-items: center; margin-top: 1.5rem; }
  .pager button:disabled { opacity: .4; cursor: default; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(900px, 94vw); max-height: 90vh; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .detail { padding: 1.25rem; display: grid; gap: .75rem; }
  .gallery { display: grid; grid-auto-flow: column; grid-auto-columns: 85%; gap: .5rem; overflow-x: auto; scroll-snap-type: x mandatory; }
  .gallery img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 8px; scroll-snap-align: start; }
  .close { position: sticky; top: 0; float: right; margin: .75rem; }
  .remarks { color: #c3ccd5; line-height: 1.5; }
  .office { color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
  <header>
    <a class="brand" href="/">Matthew</a>
    <h1>Listings</h1>
  </header>
  <div class="demo">Demo data: these listings come from Bridge's generated test feed, not real properties.</div>

  <main>
    <form id="search">
      <label>Dataset
        <select name="dataset">
          <option value="test_sd">San Diego (test)</option>
          <option value="test_sf">San Francisco (test)</option>
          <option value="test">Static test</option>
        </select>
      </label>
      <label>City <input name="city" maxlength="60" placeholder="Any"></label>
      <label>Min price <input name="minPrice" inputmode="numeric" placeholder="$0"></label>
      <label>Max price <input name="maxPrice" inputmode="numeric" placeholder="No max"></label>
      <label>Beds
        <select name="beds"><option value="">Any</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      </label>
      <label>Baths
        <select name="baths"><option value="">Any</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
      </label>
      <label>Sort
        <select name="sort">
          <option value="newest">Newest</option>
          <option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option>
        </select>
      </label>
      <button class="primary" type="submit">Search</button>
    </form>

    <p class="status" id="status" role="status"></p>
    <div class="grid" id="grid"></div>
    <div class="pager">
      <button id="prev" type="button">Previous</button>
      <span id="pageInfo"></span>
      <button id="next" type="button">Next</button>
    </div>
  </main>

  <dialog id="detail">
    <button class="close" type="button" id="closeDetail">Close</button>
    <div class="detail" id="detailBody"></div>
  </dialog>

<script>
(() => {
  const PAGE_SIZE = 12;
  const form = document.getElementById("search");
  const grid = document.getElementById("grid");
  const status = document.getElementById("status");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const pageInfo = document.getElementById("pageInfo");
  const dialog = document.getElementById("detail");
  const detailBody = document.getElementById("detailBody");
  let page = 1, total = 0, current = [];

  const money = (n) => n == null ? "Price n/a" : "$" + Number(n).toLocaleString("en-US");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const facts = (r) => [
    r.BedroomsTotal != null ? r.BedroomsTotal + " bd" : null,
    r.BathroomsTotalInteger != null ? r.BathroomsTotalInteger + " ba" : null,
    r.LivingArea != null ? Number(r.LivingArea).toLocaleString("en-US") + " sqft" : null,
  ].filter(Boolean).join(" · ");

  function params() {
    const p = new URLSearchParams();
    for (const [k, v] of new FormData(form)) {
      const val = k === "city" ? String(v).trim() : String(v).replace(/[$,\s]/g, "");
      if (val) p.set(k, val);
    }
    p.set("page", page);
    p.set("pageSize", PAGE_SIZE);
    return p;
  }

  async function load() {
    status.textContent = "Loading…";
    grid.replaceChildren();
    try {
      const res = await fetch("/api/listings?" + params());
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      current = data.results;
      total = data.total || 0;
      render();
    } catch (e) {
      status.textContent = "Couldn't load listings: " + e.message;
      prev.disabled = next.disabled = true;
      pageInfo.textContent = "";
    }
  }

  function render() {
    status.textContent = total ? total.toLocaleString("en-US") + " active listings" : "No listings match.";
    for (const r of current) {
      const card = el("button", "card");
      card.type = "button";
      const img = el("img");
      img.loading = "lazy";
      img.alt = r.UnparsedAddress || "Listing photo";
      if (r.Photos[0]) img.src = r.Photos[0];
      const body = el("div", "body");
      body.append(el("div", "price", money(r.ListPrice)), el("div", "facts", facts(r)), el("div", "addr", r.UnparsedAddress || [r.City, r.StateOrProvince].filter(Boolean).join(", ")));
      card.append(img, body);
      card.addEventListener("click", () => openDetail(r));
      grid.append(card);
    }
    const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    pageInfo.textContent = "Page " + page + " of " + pages.toLocaleString("en-US");
    prev.disabled = page <= 1;
    next.disabled = page >= pages;
  }

  function openDetail(r) {
    detailBody.replaceChildren();
    const gallery = el("div", "gallery");
    for (const src of r.Photos) { const i = el("img"); i.src = src; i.alt = ""; i.loading = "lazy"; gallery.append(i); }
    const extra = [
      r.PropertySubType || r.PropertyType,
      r.YearBuilt ? "Built " + r.YearBuilt : null,
      r.LotSizeAcres ? r.LotSizeAcres + " acre lot" : null,
      r.DaysOnMarket != null ? r.DaysOnMarket + " days on market" : null,
    ].filter(Boolean).join(" · ");
    detailBody.append(
      gallery,
      el("div", "price", money(r.ListPrice)),
      el("div", "facts", facts(r)),
      el("div", "addr", r.UnparsedAddress || ""),
      el("div", "facts", extra),
      el("p", "remarks", r.PublicRemarks || ""),
      el("div", "office", r.ListOfficeName ? "Listed by " + r.ListOfficeName : "")
    );
    dialog.showModal();
  }

  document.getElementById("closeDetail").addEventListener("click", () => dialog.close());
  dialog.addEventListener("click", (e) => { if (e.target === dialog) dialog.close(); });
  form.addEventListener("submit", (e) => { e.preventDefault(); page = 1; load(); });
  prev.addEventListener("click", () => { if (page > 1) { page--; load(); } });
  next.addEventListener("click", () => { page++; load(); });
  load();
})();
</script>
</body>
</html>
